[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyclem3d"
version = "0.1.0"
description = "Volumetric confocal <-> volume-EM correlation: lazy data layer, EM stack alignment, 3D landmark registration, honest QC, and co-registered multimodal export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Evan Krystofiak" }]
keywords = ["CLEM", "correlative microscopy", "FIB-SEM", "SBF-SEM", "confocal", "registration", "napari"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Framework :: napari",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "dask[array]>=2024.8",
  "zarr>=2.18",
  "tifffile>=2024.8",
  "mrcfile>=1.5",
  "psutil>=6.0",
  "imageio>=2.34",
]

[project.optional-dependencies]
gui = ["napari>=0.5", "magicgui>=0.9", "qtpy>=2.4", "PyQt6>=6.6"]
readers = ["bioio>=1.1", "bioio-ome-tiff", "bioio-lif", "bioio-czi", "bioio-nd2", "h5py>=3.11"]
export = ["h5py>=3.11", "ome-zarr>=0.9"]
itk = ["SimpleITK>=2.3"]
gpu = ["cupy-cuda12x>=13"]
seg = ["empanada-napari>=1.2", "quantem-core>=0.1", "napari-quantem>=0.1", "torch>=2.4", "torchvision>=0.19"]
distributed = ["dask[distributed]>=2024.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.8", "h5py>=3.11"]

[project.scripts]
pyclem3d = "pyclem3d.cli:main"

[project.entry-points."napari.manifest"]
pyclem3d = "pyclem3d.napari:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/pyclem3d"]

[tool.hatch.build.targets.sdist]
include = ["src/pyclem3d", "tests", "README.md", "pyclem3d_plan_v2.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: large-data smoke tests", "gui: needs napari/Qt (offscreen)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "E741", "B008", "B905"]

[tool.uv]
default-groups = []

# PyTorch with CUDA on Windows/Linux comes from the PyTorch index, not PyPI (which is CPU-only on Windows)
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
